name: Warehouse verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test history, quality gates, replay, and publication
        run: python -m unittest -v
      - name: Reproduce complete demo
        run: python demo.py
      - name: Build Docker image
        run: docker build -t customer-360 .
      - name: Run containerized demo
        run: docker run --rm customer-360
      - uses: actions/upload-artifact@v7
        with:
          name: customer-360-demo-results
          path: demo-output/
